<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>야자탈출 · 챕터 선택</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #132744;
        color: white;
        font-family: system-ui, sans-serif;
      }
      main {
        max-width: 1120px;
        min-height: 100vh;
        margin: auto;
        display: grid;
        place-content: center;
        padding: 24px;
      }
      .scene {
        position: relative;
        width: min(1050px, calc(100vw - 48px));
        margin: auto;
      }
      .scene > img {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 20px;
        image-rendering: auto;
      }
      .hit {
        position: absolute;
        border: 0;
        background: transparent;
        cursor: pointer;
        color: transparent;
        font-size: 1px;
      }
      .hit:focus-visible {
        outline: 4px solid #fff297;
        border-radius: 12px;
      }
      .start {
        left: 32%;
        top: 62%;
        width: 40%;
        height: 22%;
      }
      .chapter {
        top: 24%;
        width: 27%;
        height: 61%;
      }
      .ch1 {
        left: 7%;
      }
      .ch2 {
        left: 37%;
      }
      .ch3 {
        left: 66%;
      }
      .back {
        margin: 18px auto;
        display: block;
        background: #fff0bf;
        color: #573f43;
        border: 0;
        border-radius: 9px;
        padding: 12px 22px;
        cursor: pointer;
      }
      .note {
        font-size: 12px;
        text-align: center;
        color: #e3dabe;
        max-width: 900px;
        line-height: 1.8;
      }
      .white {
        position: absolute;
        left: 14%;
        top: 54%;
        width: 15%;
        height: 27%;
        object-fit: contain;
        pointer-events: none;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <main>
      <section id="home" class="scene">
        <img
          src="assets/maps/main.png"
          alt="원본 크리스마스 학교 시작 화면"
        /><button id="start" class="hit start" aria-label="게임 시작">
          게임 시작
        </button>
      </section>
      <section id="select" hidden>
        <div class="scene">
          <img src="assets/maps/select.png" alt="원본 챕터 선택 화면" /><img
            class="white"
            src="chapter1/images/player/run1.png"
            alt="챕터1의 기존 하얀 캐릭터"
          /><a
            class="hit chapter ch1"
            href="chapter1/chapter1.html"
            aria-label="챕터 1 교실 탈출"
            >챕터1</a
          ><a
            class="hit chapter ch2"
            href="chapter2.html"
            aria-label="챕터 2 복도 탈출"
            >챕터2</a
          ><a
            class="hit chapter ch3"
            href="chapter3.html"
            aria-label="챕터 3 야자 탈출"
            >챕터3</a
          >
        </div>
        <button id="back" class="back">시작 화면으로</button>
        <p class="note">
          챕터1은 저장소의 기존 하얀 캐릭터를 사용합니다. 응원 전용 포즈와 챕터2
          베이지색 토끼 원본은 제공된 두 시트에 없어 추가 파일이 필요합니다.
          챕터2는 원본 선택 화면의 사물 그림을 유지합니다.
        </p>
      </section>
    </main>
    <script>
      function render() {
        const select = location.hash === "#chapters";
        document.getElementById("home").hidden = select;
        document.getElementById("select").hidden = !select;
      }
      document.getElementById("start").onclick = () =>
        (location.hash = "chapters");
      document.getElementById("back").onclick = () => (location.hash = "");
      addEventListener("hashchange", render);
      render();
    </script>
  </body>
</html>
