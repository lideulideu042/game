<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>우리들의 학교 탈출</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e7f1df;
        color: #34483c;
        font-family:
          "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
      }
      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible {
        outline: 4px solid #e79759;
        outline-offset: 5px;
      }
      [hidden] {
        display: none !important;
      }
      .world {
        position: relative;
        isolation: isolate;
        max-width: 1440px;
        min-height: 800px;
        height: 100vh;
        margin: auto;
        overflow: hidden;
        background: #dcefe9;
      }
      .scenery {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 26px 44px;
        font-size: 11px;
        letter-spacing: 0.1em;
      }
      .brand {
        font-weight: 900;
        color: #436d59;
      }
      .tag {
        border: 1px solid #73938270;
        background: #fff9;
        padding: 7px 12px;
        border-radius: 30px;
      }
      .intro {
        text-align: center;
        padding-top: 24px;
      }
      .eyebrow {
        font-size: 12px;
        letter-spacing: 0.2em;
        color: #61806a;
        font-weight: 800;
      }
      h1 {
        font-size: clamp(38px, 5vw, 64px);
        letter-spacing: -0.06em;
        margin: 12px 0;
        color: #355a48;
        text-shadow: 0 3px #fff9;
      }
      .intro p {
        font-size: 14px;
        color: #597363;
        margin-top: 12px;
      }
      .home-actions {
        position: absolute;
        top: 69%;
        left: 50%;
        transform: translateX(-50%);
        display: grid;
        gap: 12px;
        width: 252px;
      }
      .primary {
        background: #fae1a5;
        border: 2px solid #9b8050;
        border-bottom: 5px solid #9b8050;
        border-radius: 15px;
        padding: 17px 26px;
        font-size: 21px;
        font-weight: 900;
        color: #65502d;
        box-shadow: 0 5px 0 #fff5;
      }
      .primary:hover {
        background: #ffedbf;
        transform: translateY(-2px);
      }
      .secondary {
        border: 1px solid #789784;
        border-bottom: 3px solid #789784;
        background: #fffdf0ed;
        color: #496c56;
        border-radius: 12px;
        padding: 12px 20px;
        font-size: 13px;
        font-weight: 700;
      }
      .secondary:hover {
        background: #fff;
      }
      .bottom {
        position: absolute;
        bottom: 24px;
        left: 44px;
        right: 44px;
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: #406849;
      }
      .chapter-screen {
        position: absolute;
        inset: 78px 0 70px;
        background: #eff6e9e8;
        backdrop-filter: blur(7px);
        text-align: center;
        padding: 32px 24px;
        border-top: 1px solid #fff8;
      }
      .chapter-screen h2 {
        font-size: 32px;
        margin: 10px 0 6px;
        letter-spacing: -0.04em;
      }
      .chapter-screen > p {
        color: #7b8d7d;
        font-size: 13px;
        margin-bottom: 32px;
      }
      .cards {
        display: flex;
        justify-content: center;
        align-items: stretch;
        gap: 22px;
        margin: 0 auto 26px;
      }
      .chapter {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 214px;
        min-height: 326px;
        border: 2px solid #fff;
        border-radius: 20px;
        background: #fffdf5;
        text-decoration: none;
        color: #354e42;
        overflow: hidden;
        box-shadow:
          0 8px 0 #70835e18,
          0 10px 24px #45654412;
        transition:
          transform 0.15s,
          border-color 0.15s;
      }
      .chapter:hover {
        transform: translateY(-8px);
        border-color: #aac8a3;
      }
      .scene {
        height: 157px;
        position: relative;
        background: var(--sky);
        overflow: hidden;
      }
      .scene svg {
        width: 100%;
        height: 100%;
      }
      .scene > img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .character {
        position: relative;
        align-self: center;
        width: 78px;
        height: 78px;
        margin-top: -38px;
        border-radius: 50%;
        background: #fffcf1;
        border: 4px solid #fffdf5;
        display: grid;
        place-items: center;
        z-index: 1;
      }
      .character svg {
        width: 58px;
        height: 58px;
      }
      .character img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .chapter .number {
        font-size: 10px;
        letter-spacing: 0.15em;
        color: #95a18c;
        margin: 10px 0 4px;
      }
      .chapter h3 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      .chapter small {
        font-size: 12px;
        color: #81917c;
      }
      .chapter .arrow {
        margin: 20px 0;
        color: #6e916b;
        font-size: 17px;
      }
      .chapter:last-child {
        background: #f4f5e7;
      }
      .chapter:last-child h3 {
        color: #68734c;
      }
      dialog {
        width: min(520px, calc(100% - 32px));
        min-height: 260px;
        border: 2px solid #b4c9a6;
        border-radius: 20px;
        background: #fffcf1;
        color: #3e5b46;
        padding: 28px;
        box-shadow: 0 20px 80px #344d3840;
      }
      dialog::backdrop {
        background: #2e4c4b80;
        backdrop-filter: blur(5px);
      }
      dialog h2 {
        margin: 0;
        font-size: 22px;
      }
      .close {
        position: absolute;
        right: 17px;
        top: 14px;
        border: 0;
        background: transparent;
        font-size: 26px;
        color: #68816b;
        padding: 4px 9px;
      }
      .placeholder {
        height: 145px;
      }
      @media (max-width: 700px) {
        .top {
          padding: 22px;
        }
        .tag {
          display: none;
        }
        .world {
          min-height: 780px;
        }
        .cards {
          gap: 10px;
        }
        .chapter {
          width: 30%;
          min-height: 282px;
        }
        .scene {
          height: 125px;
        }
        .chapter h3 {
          font-size: 17px;
        }
        .chapter small {
          font-size: 10px;
        }
        .chapter-screen {
          padding: 26px 10px;
        }
        .character {
          width: 64px;
          height: 64px;
        }
        .character svg {
          width: 49px;
        }
        .bottom {
          left: 20px;
          right: 20px;
          font-size: 9px;
        }
        .intro {
          padding-top: 40px;
        }
        .intro p {
          font-size: 12px;
        }
      }
      body {
        background: #1b3659;
      }
      .world {
        background: #233c65;
      }
      .brand {
        color: #fff1bd;
      }
      .tag {
        color: #fff4cb;
        border-color: #c3d6e088;
        background: #23475fa8;
      }
      .eyebrow {
        color: #fae09c;
      }
      h1 {
        color: #fff4cd;
        text-shadow:
          0 4px #44648c,
          0 7px 20px #1c2c55;
      }
      .intro p {
        color: #edf6ff;
      }
      .primary {
        background: #ee7a96;
        border-color: #a74162;
        color: #fff9e4;
        text-shadow: 0 1px #b54666;
      }
      .primary:hover {
        background: #f494ab;
      }
      .secondary {
        background: #fff1c9;
        border-color: #bda265;
        color: #806137;
      }
      .chapter-screen {
        background: #203f68db;
        border-color: #8bacc5;
        color: #fff5d8;
      }
      .chapter-screen > p {
        color: #d6e8f2;
      }
      .chapter:last-child {
        border-color: #e6bc5c;
      }
      .chapter {
        border: 3px solid #e5d6b7;
      }
      .bottom {
        color: #435e7d;
      }
      .asset-note {
        font-size: 9px;
        line-height: 1.5;
        color: #99704f;
      }
      .chapter-mark {
        font-size: 23px;
        color: #9aab99;
        font-weight: 900;
      }
      .character:empty {
        display: none;
      }
      .scene:after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: #f7fcff;
        border-radius: 50% 50% 0 0;
      }
      .chapter .number {
        color: #899c88;
      }
    </style>

      <header class="top">
        <span class="brand">✿ SCHOOL ESCAPE</span
        ><span class="tag">우리들의 작은 방과 후 모험</span>
      </header>
      <section id="home-screen" aria-labelledby="title">
        <div class="intro">
          <span class="eyebrow">A CHRISTMAS SCHOOL ADVENTURE</span>
          <h1 id="title">우리들의 학교 탈출</h1>
          <p>눈 내리는 우리 학교, 세 가지 시간 속으로.</p>
        </div>
        <div class="home-actions">
          <button id="start-button" class="primary" type="button">
            게임 시작　→</button
          ><button id="rules-button" class="secondary" type="button">
            규칙 설명
          </button>
        </div>
      </section>
      <section
        id="chapter-screen"
        class="chapter-screen"
        aria-labelledby="chapter-title"
        hidden
      >
        <span class="eyebrow">CHOOSE YOUR CHAPTER</span>
        <h2 id="chapter-title" tabindex="-1">어떤 시간으로 떠나볼까?</h2>
        <p>플레이할 챕터를 골라 주세요.</p>
        <div class="cards" id="cards"></div>
        <button class="secondary" id="back-button" type="button">
          ← 시작 화면으로
        </button>
      </section>
      <footer class="bottom">
        <span>MADE BY THREE FRIENDS</span
        ><span>PC · 키보드와 마우스로 플레이해요</span>
      </footer>
    </main>
    <dialog id="rules-dialog" aria-labelledby="rules-title">
      <h2 id="rules-title">규칙 설명</h2>
      <button
        type="button"
        class="close"
        id="rules-close"
        aria-label="규칙 설명 닫기"
      >
        ×
      </button>
      <div class="placeholder"></div>
    </dialog>
    <script>
      "use strict";
      // 팀원 이미지를 받으면 scene(사진)과 character(캐릭터)에 상대 경로만 넣으세요.
      const CHAPTER_ASSETS = [
        {
          number: 1,
          name: "아침",
          subtitle: "하루의 시작",
          sky: "#d8ece5",
          accent: "#efce85",
          scene: "",
          character: "",
        },
        {
          number: 2,
          name: "점심",
          subtitle: "햇살 가득한 학교",
          sky: "#dcebd0",
          accent: "#b5c988",
          scene: "",
          character: "",
        },
        {
          number: 3,
          name: "야자탈출",
          subtitle: "저녁, 학교를 빠져나가자!",
          sky: "#d9dbe8",
          accent: "#95b6cc",
          scene: "",
          character: "assets/player/idle.png",
        },
      ];
      CHAPTER_ASSETS.forEach((data) => {
        const card = document.createElement("a");
        card.className = "chapter";
        card.href = `chapter${data.number}.html`;
        card.setAttribute("aria-label", `챕터 ${data.number} ${data.name}`);
        card.innerHTML = `<div class="scene" style="--sky:${data.sky}"><svg viewBox="0 0 214 157" aria-hidden="true"><circle cx="170" cy="28" r="17" fill="#fff2bc"/><path d="M0 122q60-28 115 0 60-24 99 0v35H0" fill="#b0c4a0"/><path d="M24 62h167v68H24z" fill="#efdfbd"/><path d="M18 62l16-13h147l16 13" fill="#90aaa0"/><path d="M87 42l20-13 20 13v88H87" fill="#faf0d7"/><g fill="#a9c4c5"><path d="M36 76h14v16H36zm25 0h14v16H61zm77 0h14v16h-14zm25 0h14v16h-14zM36 103h14v16H36zm25 0h14v16H61zm77 0h14v16h-14zm25 0h14v16h-14z"/></g><path d="M100 111h14v19h-14" fill="#7e9c91"/><circle cx="107" cy="55" r="7" fill="#c7d4b9"/></svg></div><div class="character">${data.number === 3 ? '<span class="asset-note">원본 이미지<br>준비 중</span>' : `<span class="chapter-mark">0${data.number}</span>`}</div><span class="number">CHAPTER 0${data.number}</span><h3>${data.name}</h3><small>${data.subtitle}</small><span class="arrow">↗</span>`;
        for (const [key, selector] of [
          ["scene", ".scene"],
          ["character", ".character"],
        ]) {
          if (!data[key]) continue;
          const image = new Image();
          image.alt = key === "character" ? "하치와레 원본 기본 대기" : "";
          image.src = data[key];
          image.onerror = () => image.remove();
          if (key === "character")
            image.onload = () => {
              const note = card.querySelector(".asset-note");
              if (note) note.hidden = true;
            };
          card.querySelector(selector).append(image);
        }
        document.getElementById("cards").append(card);
      });
      function showScreen() {
        const selecting = location.hash === "#chapters";
        document.getElementById("home-screen").hidden = selecting;
        document.getElementById("chapter-screen").hidden = !selecting;
        if (selecting)
          document
            .getElementById("chapter-title")
            .focus({ preventScroll: true });
      }
      document.getElementById("start-button").addEventListener("click", () => {
        location.hash = "chapters";
      });
      document.getElementById("back-button").addEventListener("click", () => {
        location.hash = "";
      });
      const rules = document.getElementById("rules-dialog");
      document
        .getElementById("rules-button")
        .addEventListener("click", () => rules.showModal());
      document
        .getElementById("rules-close")
        .addEventListener("click", () => rules.close());
      window.addEventListener("hashchange", showScreen);
      showScreen();
    </script>
  </body>
